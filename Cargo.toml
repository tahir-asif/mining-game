[workspace]
members = [".", "shared", "level_editor"]
resolver = "3"

[package]
name = "mining_game"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[profile.profiling]
inherits = "release"
debug = true

[dependencies]
egui-macroquad = "0.17.3"
macroquad = "0.4.16"
quad-storage = "0.1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shared = { path = "shared" }

[build-dependencies]
ron = "0.12"
shared = { path = "shared" }
